
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StacklyNexus // Provision Fresh Operative Node</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page-root">

    <!-- Deep Ambient Blur Background Canvas -->
    <div class="auth-bg-layer">
        <svg class="auth-vector-grid" viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://w3.org">
            <defs>
                <pattern id="signup-matrix" width="10" height="10" patternUnits="userSpaceOnUse">
                    <path d="M 10 0 L 0 0 0 10" fill="none" stroke="rgba(6, 182, 212, 0.015)" stroke-width="0.5"/>
                </pattern>
            </defs>
            <rect width="100" height="100" fill="url(#signup-matrix)" />
        </svg>
        <div class="auth-glow-orb tone-ice"></div>
        <div class="auth-glow-orb tone-sapphire"></div>
    </div>

    <!-- Central Authentication Frame Container -->
    <main class="auth-frame-container">
        <div class="auth-card-hull">
            <div class="auth-card-neon-perimeter"></div>
            
            <div class="auth-card-inner">
                
                <!-- Internal Header Return Control Bar -->
                <div class="auth-card-header-actions">
                    <a href="login.html" class="btn-card-back-trigger" aria-label="Abort registration and return to log in gateway">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                        <span>BACK TO LOG IN</span>
                    </a>
                </div>

                <!-- Section Header Context Box -->
                <header class="auth-header-block">
                    <h1 class="auth-main-title">Create <span>Account</span></h1>
                    <p class="auth-subtitle-desc">Register your artisan profile to open your customized sandbox project registry dashboard and track order milestones.</p>
                </header>

                <!-- Input Payload Form Stack -->
                <form id="secure-registration-form" class="auth-payload-form" novalidate>
                    
                    <!-- Input 01: Operator Name Row -->
                    <div class="auth-field-node">
                        <label for="reg-name" class="auth-field-label">Your Full Name</label>
                        <input type="text" id="reg-name" placeholder="Enter your full name..." class="auth-raw-input">
                    </div>

                    <!-- Input 02: Routing Email Address -->
                    <div class="auth-field-node">
                        <label for="reg-email" class="auth-field-label">Email Address</label>
                        <input type="email" id="reg-email" placeholder="you@example.com" class="auth-raw-input">
                    </div>

                    <!-- Input 03: Telemetry Hotwire Mobile Number Row -->
                    <div class="auth-field-node">
                        <label for="reg-mobile" class="auth-field-label">10-Digit Mobile Number</label>
                        <input type="text" id="reg-mobile" maxlength="10" placeholder="10-digit mobile number" class="auth-raw-input">
                    </div>

                    <!-- Input 04: Master Password Key Row -->
                    <div class="auth-field-node">
                        <label for="reg-password" class="auth-field-label">Password Key</label>
                        <div class="auth-password-wrapper">
                            <input type="password" id="reg-password" placeholder="••••••••" class="auth-raw-input">
                            <button type="button" class="btn-toggle-field-visibility" data-target="reg-password" aria-label="Toggle password visibility">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            </button>
                        </div>
                    </div>

                    <!-- Input 05: Confirm Password Key Row -->
                    <div class="auth-field-node">
                        <label for="reg-confirm" class="auth-field-label">Confirm Password Key</label>
                        <div class="auth-password-wrapper">
                            <input type="password" id="reg-confirm" placeholder="••••••••" class="auth-raw-input">
                            <button type="button" class="btn-toggle-field-visibility" data-target="reg-confirm" aria-label="Toggle password verification visibility">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            </button>
                        </div>
                    </div>

                    <!-- Inline Feedback State Notifications Board -->
                    <span class="auth-gateway-alert" id="reg-validation-msg"></span>

                    <!-- Primary Deployment Action Submission Trigger -->
                    <button type="submit" class="btn-auth-handshake-submit btn-signup-glow">
                        <span>Sign Up →</span>
                    </button>

                </form>

                <!-- Registration Redirect Anchor Footer -->
                <footer class="auth-card-footer">
                    <p>Already have an account? <a href="login.html" class="auth-redirect-link">Log In</a></p>
                </footer>

            </div>
        </div>
    </main>

   


    
    <style>
       /* 🌟 PREMIUM SYSTEM GLOBAL VARIABLES & AUTO-RESET */
:root {
    --bg-main: #070a13;
    --bg-surface: #111726;
    --text-main: #ffffff;
    --text-muted: #cbd5e1;
    --primary: #06b6d4;      /* Icy Cyan Glow Focus */
    --accent: #3b82f6;       /* Sapphire Blue */
    --success: #10b981;      /* Crisp Emerald */
    --border: rgba(255, 255, 255, 0.08);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body.auth-page-root {
    width: 100vw;
    min-height: 100vh;
    background-color: var(--bg-main);
    color: var(--text-main);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow-x: hidden;
    padding: 2rem 0;
}

/* Background Canvas Graphics Layers mapping */
.auth-bg-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
}

.auth-vector-grid {
    width: 100%;
    height: 100%;
}

.auth-glow-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(140px);
    opacity: 0.15;
    mix-blend-mode: screen;
}

.tone-ice { top: -10%; right: 15%; width: 550px; height: 550px; background: radial-gradient(circle, var(--primary) 0%, transparent 70%); }
.tone-sapphire { bottom: -10%; left: 10%; width: 450px; height: 450px; background: radial-gradient(circle, var(--accent) 0%, transparent 70%); }

/* Central Authentication Frame Container */
.auth-frame-container {
    position: relative;
    width: 92%;
    max-width: 520px;
    z-index: 5;
}

.auth-card-hull {
    position: relative;
    width: 100%;
    background: linear-gradient(135deg, rgba(17, 23, 38, 0.75) 0%, rgba(7, 10, 19, 0.5) 100%);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border-radius: 16px;
}

/* Emulates sharp cyber perimeter lines */
.auth-card-hull::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 16px;
    padding: 1px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.01) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    transition: background 0.4s ease;
    z-index: 5;
}

.auth-card-inner {
    padding: 3rem 2.75rem;
}

/* Internal Header Return Control Bar Placement */
.auth-card-header-actions {
    display: flex;
    justify-content: flex-end;
    width: 100%;
    margin-bottom: 0.5rem;
}

.btn-card-back-trigger {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background-color: rgba(7, 10, 19, 0.4);
    border: 1px solid var(--border);
    padding: 0.45rem 1.1rem;
    border-radius: 6px;
    color: var(--text-muted);
    font-size: 0.7rem;
    font-weight: 700;
    text-decoration: none;
    letter-spacing: 0.5px;
    transition: all 0.3s ease;
}

.btn-card-back-trigger svg {
    width: 12px;
    height: 12px;
    transition: transform 0.2s ease, color 0.2s ease;
}

.btn-card-back-trigger:hover {
    color: #ffffff;
    border-color: var(--primary);
    background-color: rgba(6, 182, 212, 0.08);
    box-shadow: 0 0 12px rgba(6, 182, 212, 0.25);
}

.btn-card-back-trigger:hover svg { transform: translateX(-2px); color: var(--primary); }

.auth-header-block {
    margin-bottom: 2rem;
    text-align: left;
}

.auth-main-title {
    font-size: 2.25rem;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: -0.75px;
    margin: 0 0 0.75rem 0;
}

.auth-main-title span {
    background: linear-gradient(135deg, #22d3ee 0%, #3b82f6 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 15px rgba(34, 211, 238, 0.25));
}

.auth-subtitle-desc {
    font-size: 0.9rem;
    line-height: 1.55;
    color: var(--text-muted);
    margin: 0;
}

/* 🌟 FORM COMPONENT BLOCK ENGINE FLOW */
.auth-payload-form {
    display: flex;
    flex-direction: column;
    gap: 1.35rem;
    width: 100%;
}

.auth-field-node {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    width: 100%;
}

.auth-field-label {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #ffffff;
    text-align: left;
}

.auth-raw-input {
    width: 100%;
    display: block;
    background-color: rgba(7, 10, 19, 0.6);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.85rem 1.25rem;
    color: #ffffff;
    font-size: 0.95rem;
    outline: none;
    box-sizing: border-box;
    font-family: inherit;
    transition: all 0.3s ease;
}

.auth-raw-input:focus {
    border-color: var(--primary);
    background-color: rgba(17, 23, 38, 0.8);
    box-shadow: 0 0 15px rgba(6, 182, 212, 0.15);
}

.auth-raw-input.input-error-state {
    border-color: #ef4444 !important;
    box-shadow: 0 0 12px rgba(239, 68, 68, 0.2) !important;
}

.auth-password-wrapper {
    position: relative;
    width: 100%;
}

.auth-password-wrapper .auth-raw-input {
    padding-right: 3rem;
}

.btn-toggle-field-visibility {
    position: absolute;
    right: 1.25rem;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 0;
}

.btn-toggle-field-visibility svg {
    width: 16px;
    height: 16px;
    transition: color 0.2s ease;
}

.btn-toggle-field-visibility:hover svg { color: #ffffff; }

/* Real-Time Status Alerts */
.auth-gateway-alert {
    font-size: 0.8rem;
    color: #ef4444;
    font-weight: 600;
    min-height: 18px;
    display: block;
    opacity: 0;
    transform: translateY(-3px);
    transition: all 0.3s ease;
    text-align: center;
    line-height: 1.4;
}

.auth-gateway-alert.alert-visible { opacity: 1; transform: translateY(0); }
.auth-gateway-alert.success-state-msg { color: var(--success) !important; text-shadow: 0 0 8px rgba(16, 185, 129, 0.3); }

/* Primary Form Handle Actions Switch Button */
.btn-auth-handshake-submit {
    width: 100%;
    padding: 0.95rem 0;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    display: block;
}

.btn-signup-glow {
    background-color: #06b6d4;
    color: #070a13;
    font-weight: 700;
    box-shadow: 0 4px 15px rgba(6, 182, 212, 0.35);
}

.btn-signup-glow:hover {
    background-color: #ffffff;
    color: #070a13;
    box-shadow: 0 6px 22px rgba(255, 255, 255, 0.4), 0 0 15px #06b6d4;
    transform: translateY(-1px);
}

.auth-card-footer {
    text-align: center;
    border-top: 1px solid rgba(255, 255, 255, 0.04);
    padding-top: 1.5rem;
    margin-top: 0.5rem;
}

.auth-card-footer p { font-size: 0.85rem; color: var(--text-muted); }
.auth-redirect-link { font-size: 0.85rem; font-weight: 600; color: var(--primary); text-decoration: none; margin-left: 2px; transition: color 0.2s ease, text-shadow 0.2s ease; }
.auth-redirect-link:hover { color: #22d3ee; text-shadow: 0 0 8px rgba(34, 211, 238, 0.3); }

/* Card Neon Path Overlays on Hover */
.auth-card-hull:hover::before {
    background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
}

.auth-card-hull:hover {
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.45), 0 0 35px rgba(6, 182, 212, 0.08);
}

/* 📱 ADAPTIVE MOBILE LAYOUT OVERRIDES */
@media (max-width: 520px) {
    body.auth-page-root { padding: 1rem 0; }
    .auth-card-inner { padding: 2.25rem 1.5rem; }
    .auth-main-title { font-size: 1.85rem; }
    .auth-card-header-actions { justify-content: center; margin-bottom: 1rem; }
}


    </style>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
    
    // 🌟 Secure Registry Deployment Pipeline Control Rig
    const signupFormNode = document.getElementById("secure-registration-form");
    const nameInputNode = document.getElementById("reg-name");
    const emailInputNode = document.getElementById("reg-email");
    const mobileInputNode = document.getElementById("reg-mobile");
    const passwordInputNode = document.getElementById("reg-password");
    const confirmInputNode = document.getElementById("reg-confirm");
    const feedbackMsgSpan = document.getElementById("reg-validation-msg");
    const visibilityToggleButtons = document.querySelectorAll(".btn-toggle-field-visibility");

    if (signupFormNode) {

        // 1. Constraint Check A: Filter out numbers inside Name field on type intervals
        nameInputNode.addEventListener("input", () => {
            nameInputNode.value = nameInputNode.value.replace(/[0-9]/g, "");
        });

        // 2. Constraint Check B: Filter out alphabetical characters inside Mobile field
        mobileInputNode.addEventListener("input", () => {
            mobileInputNode.value = mobileInputNode.value.replace(/[^0-9]/g, "");
        });

        // 3. Hide/Reveal Password Text Baselines across targeted input arrays
        visibilityToggleButtons.forEach(btn => {
            btn.addEventListener("click", () => {
                const targetFieldId = btn.getAttribute("data-target");
                const targetInput = document.getElementById(targetFieldId);
                
                if (targetInput) {
                    const isHidden = targetInput.getAttribute("type") === "password";
                    targetInput.setAttribute("type", isHidden ? "text" : "password");
                    btn.style.color = isHidden ? "var(--primary)" : "var(--text-muted)";
                }
            });
        });

        // 4. Central Form Submission Processing Engine Grid Loop
        signupFormNode.addEventListener("submit", (event) => {
            event.preventDefault(); // Halt default browser data dispatches

            const cleanName = nameInputNode.value.trim();
            const cleanEmail = emailInputNode.value.trim();
            const cleanMobile = mobileInputNode.value.trim();
            const cleanPass = passwordInputNode.value.trim();
            const cleanConfirm = confirmInputNode.value.trim();

            // Validation index A: Verify if any cell input is empty
            if (!cleanName || !cleanEmail || !cleanMobile || !cleanPass || !cleanConfirm) {
                triggerGatewayAlert("Please fill out all fields.");
                highlightAllEmptyFields();
                return;
            }

            // Validation index B: Match global email address structural parameters via regex criteria
            const standardEmailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!standardEmailPattern.test(cleanEmail)) {
                triggerGatewayAlert("Please provide a valid routing email address.");
                emailInputNode.classList.add("input-error-state");
                return;
            }

            // Validation index C: Require precise 10-digit telephone sequence boundaries
            if (cleanMobile.length !== 10) {
                triggerGatewayAlert("Please provide an accurate 10-digit mobile sequence.");
                mobileInputNode.classList.add("input-error-state");
                return;
            }

            // Validation index D: Enforce absolute password string identity checks
            if (cleanPass !== cleanConfirm) {
                triggerGatewayAlert("Security password keys mismatch detected.");
                passwordInputNode.classList.add("input-error-state");
                confirmInputNode.classList.add("input-error-state");
                return;
            }

            // Clear all errors and flag account creation success
            clearAllValidationErrors();
            feedbackMsgSpan.innerText = "You have successfully signed up! Use credentials to login.";
            feedbackMsgSpan.classList.add("alert-visible", "success-state-msg");
            
            // Freeze control nodes elements to preserve system pipeline state shifts
            signupFormNode.querySelectorAll("input, button").forEach(el => el.setAttribute("disabled", "true"));

            // Gracefully forward client node destination gate back onto login folder files after 3 seconds
            setTimeout(() => {
                window.location.href = "login.html";
            }, 3000);
        });

        // Drop error borders programmatically upon active operator input updates
        const inputsArray = [nameInputNode, emailInputNode, mobileInputNode, passwordInputNode, confirmInputNode];
        inputsArray.forEach(input => {
            input.addEventListener("input", () => {
                if (input.classList.contains("input-error-state")) {
                    clearAllValidationErrors();
                }
            });
        });
    }

    function triggerGatewayAlert(messageTextString) {
        feedbackMsgSpan.innerText = messageTextString;
        feedbackMsgSpan.classList.add("alert-visible");
    }

    function highlightAllEmptyFields() {
        const inputs = [nameInputNode, emailInputNode, mobileInputNode, passwordInputNode, confirmInputNode];
        inputs.forEach(input => {
            if (input.value.trim() === "") {
                input.classList.add("input-error-state");
            }
        });

        // Hardware-accelerated dynamic layout shake indicators trigger
        const activeHullBox = document.querySelector(".auth-card-hull");
        if (activeHullBox) {
            activeHullBox.style.transform = "translateX(-4px)";
            setTimeout(() => activeHullBox.style.transform = "translateX(4px)", 80);
            setTimeout(() => activeHullBox.style.transform = "", 160);
        }
    }

    function clearAllValidationErrors() {
        feedbackMsgSpan.innerText = "";
        feedbackMsgSpan.classList.remove("alert-visible", "success-state-msg");
        const inputs = [nameInputNode, emailInputNode, mobileInputNode, passwordInputNode, confirmInputNode];
        inputs.forEach(input => input.classList.remove("input-error-state"));
    }
});

    </script>
</body>
</html>
